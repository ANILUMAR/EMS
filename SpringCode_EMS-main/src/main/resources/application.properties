spring.application.name=canteenManagment

server.port=9001
#server.address=0.0.0.0

#sohaib@123
# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/managment_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
management.endpoint.shutdown.enabled=false
spring.datasource.initialization-mode=always
spring.cache.type=simple

# Force InnoDB as storage engine
spring.jpa.properties.hibernate.dialect.storage_engine=InnoDB
spring.jpa.hibernate.use-new-id-generator-mappings=false
spring.debug=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=DEBUG
# App Properties
bezkoder.app.jwtSecret= ======================BezKoder=Spring===========================
bezkoder.app.jwtExpirationMs=86400000


spring.mail.host=smtp2.iitm.ac.in
spring.mail.port=465
spring.mail.username=workflow1
spring.mail.password=wpassword
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false

