<div class="max-w-3xl mx-auto p-6 bg-white rounded-2xl shadow">
  <h2 class="text-xl font-semibold mb-4">Create Task</h2>

  <form [formGroup]="taskForm" (ngSubmit)="submitTask()" class="space-y-4">
    <!-- Task Title -->
    <div>
      <label class="block mb-1 font-medium">Task Title</label>
      <input formControlName="title" type="text" class="w-full p-2 border rounded" placeholder="Enter task title" />
    </div>

    <!-- Project -->
    <div>
      <label class="block mb-1 font-medium">Project</label>
      <select formControlName="project" class="w-full p-2 border rounded">
        <option value="">Select Project</option>
        <option *ngFor="let project of projects" [value]="project">{{ project }}</option>
      </select>
    </div>

    <!-- Module -->
    <div>
      <label class="block mb-1 font-medium">Module / Submodule / Screen</label>
      <select formControlName="module" class="w-full p-2 border rounded">
        <option value="">Select Module</option>
        <option *ngFor="let mod of modules" [value]="mod">{{ mod }}</option>
      </select>
    </div>

    <!-- Description -->
    <div>
      <label class="block mb-1 font-medium">Description</label>
      <textarea formControlName="description" class="w-full p-2 border rounded" rows="3"></textarea>
    </div>

    <!-- Steps to Reproduce -->
    <div>
      <label class="block mb-1 font-medium">Steps to Reproduce / Test Scenarios</label>
      <textarea formControlName="steps" class="w-full p-2 border rounded" rows="3"></textarea>
    </div>

    <!-- Attachment -->
    <div>
      <label class="block mb-1 font-medium">Attachments</label>
      <input type="file" (change)="onFileChange($event)" class="w-full p-2 border rounded" />
    </div>

    <!-- Comments -->
    <div>
      <label class="block mb-1 font-medium">Comments / Updates</label>
      <textarea formControlName="comments" class="w-full p-2 border rounded" rows="2"></textarea>
    </div>

    <!-- Submit -->
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
      Save Task
    </button>
  </form>
</div>
