<aside class="ems-sidebar">
  <div class="ems-sidebar__brand">
    <span class="ems-sidebar__logo">
      <mat-icon>hub</mat-icon>
    </span>
    <span class="ems-sidebar__brand-text">
      <strong>EMS</strong>
      <small>Employee Suite</small>
    </span>
  </div>

  <nav class="ems-sidebar__nav">
    <div class="ems-sidebar__group" *ngFor="let group of groups">
      <ng-container *ngIf="groupHasItems(group)">
        <span class="ems-sidebar__group-title">{{ group.title }}</span>
        <ng-container *ngFor="let item of group.items">
          <a
            class="ems-sidebar__link"
            *ngIf="isVisible(item)"
            [routerLink]="item.route"
            routerLinkActive="is-active">
            <mat-icon>{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </a>
        </ng-container>
      </ng-container>
    </div>
  </nav>

  <div class="ems-sidebar__footer">
    <span class="ems-sidebar__avatar">{{ initials }}</span>
    <span class="ems-sidebar__user">
      <strong>{{ name }}</strong>
      <small>{{ role || 'MEMBER' }}</small>
    </span>
  </div>
</aside>
