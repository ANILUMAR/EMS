<div class="ems-dialog">
  <header class="ems-dialog__head">
    <div>
      <h2>Reuse an existing task</h2>
      <p>Pick a task to copy its module, sub module, screen and description.</p>
    </div>
    <button mat-icon-button (click)="dialogRef.close()" aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <div class="ems-dialog__search">
    <mat-form-field appearance="outline" class="ems-field">
      <mat-label>Search tasks</mat-label>
      <input matInput [(ngModel)]="search" placeholder="Title, module, screen…" />
      <mat-icon matPrefix>search</mat-icon>
    </mat-form-field>
  </div>

  <div class="ems-dialog__body">
    <button class="ems-pick" *ngFor="let task of filteredTasks" (click)="onTaskDoubleClick(task)">
      <span class="ems-pick__main">
        <strong>{{ task.taskTitle }}</strong>
        <small>{{ task.module }}{{ task.subModule ? ' · ' + task.subModule : '' }}{{ task.screen ? ' · ' + task.screen : '' }}</small>
        <span class="ems-pick__desc">{{ task.description || 'No description' }}</span>
      </span>
      <mat-icon>chevron_right</mat-icon>
    </button>

    <div class="ems-empty" *ngIf="filteredTasks.length === 0">
      <mat-icon>search_off</mat-icon>
      <h3>No matching tasks</h3>
      <p>Try another search term, or start from a blank form.</p>
    </div>
  </div>
</div>
